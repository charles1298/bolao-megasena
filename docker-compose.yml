# ─── Redes isoladas ──────────────────────────────────────────────────
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

# ─── Volumes persistentes ────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local

services:

  # ─── Redis (rate-limit persistido + blacklist de tokens) ─────────
  redis:
    image: redis:7-alpine
    container_name: bolao_redis
    restart: unless-stopped
    # Colchão de RAM: evita que um container sozinho esgote a memória do host (3.8GB)
    mem_limit: 256m
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    networks:
      - backend_net
    expose:
      - "6379"

  # ─── Banco de Dados ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: bolao_db
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      POSTGRES_DB: bolao_megasena
      POSTGRES_USER: bolao_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolao_user -d bolao_megasena"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Banco NÃO exposto externamente em produção
    expose:
      - "5432"

  # ─── Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bolao_backend
    restart: unless-stopped
    mem_limit: 640m
    # Roda migrate + seed antes de iniciar o servidor
    command: >
      sh -c "
        npx prisma migrate deploy &&
        node prisma/seed.js &&
        node server.js
      "
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://bolao_user:${POSTGRES_PASSWORD}@db:5432/bolao_megasena
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET}
      TICKET_PRICE_BRL: 30.00
      ADMIN_WHATSAPP: ${ADMIN_WHATSAPP}
      ADMIN_TOTP_ISSUER: BolaoMegaSena
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      LOG_DIR: /app/logs
    volumes:
      - backend_logs:/app/logs
    networks:
      - backend_net
    expose:
      - "3001"
    healthcheck:
      disable: true

  # ─── Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_ADMIN_WHATSAPP: ${ADMIN_WHATSAPP}
        VITE_PIX_KEY: ${ADMIN_PIX_KEY}
    container_name: bolao_frontend
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - backend
    networks:
      - frontend_net
      - backend_net
    # Bind apenas em localhost: o nginx do host faz proxy_pass para 127.0.0.1:3000.
    # Assim a porta 3000 NUNCA fica exposta diretamente à internet, mesmo que o
    # firewall (ufw) falhe ou seja desabilitado por engano. Defense-in-depth.
    ports:
      - "127.0.0.1:3000:80"

# ─── Compose override para desenvolvimento ─────────────────────────
# Use: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
